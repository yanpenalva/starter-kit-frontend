name: Contract client

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract-client:
    name: Verificar contrato OpenAPI (cliente)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@12.2.0
          test "$(npm --version)" = "12.2.0"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run client:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 scripts/validate_context.py --strict --examples
      - run: python3 -m unittest discover -s tests -v
      - run: npx --yes @owlcodium/context-spec-develop@1.2.1 doctor --scope project
