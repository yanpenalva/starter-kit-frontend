name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build & Upload Preview Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Build static preview bundle
        env:
          VITE_APP_ENV: preview
          # Preview builds use staging or mock API — NEVER production
          VITE_API_URL: ${{ vars.VITE_PREVIEW_API_URL || 'https://staging-api.starterkit.com' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist-pr-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy-preview:
    name: Deploy PR Preview Environment
    needs: [build-preview]
    runs-on: ubuntu-latest
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://preview-pr-${{ github.event.pull_request.number }}.starterkit.pages.dev
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-dist-pr-${{ github.event.pull_request.number }}
          path: dist/

      - name: Verify static bundle integrity
        run: |
          test -f dist/index.html || { echo "index.html missing from artifact"; exit 1; }
          echo "Preview bundle verified. Ready for preview hosting platform deployment."
